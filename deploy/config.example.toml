# Конфиг Alice Station: /data/alice-station/config.toml
# Всё, что не указано, берётся из значений по умолчанию (agent/alice_station/config.py).

[device]
kind = "midi"
name = "alice-station-midi"
# mac = ""            # пусто — MAC wlan0

[xiaozhi]
ota_url = "https://api.tenclass.net/xiaozhi/ota/"
language = "ru-RU"
listening_mode = "auto"   # auto — конец фразы определяет сервер
idle_timeout = 12         # закрыть диалог после стольких секунд тишины

[audio]
capture_device = "alice_mic"     # из /data/alice-station/.asoundrc
playback_device = "default"
alsa_home = "/data/alice-station"

[trigger]
button_enabled = true
key_code = 582                 # KEY_VOICECOMMAND; эту же кнопку слушает Алиса
input_name_hint = "awinic_sar"

[led]
backend = "sysfs"              # sysfs | fb
brightness = 200

[panel]
port = 8060
pin = ""                       # задайте PIN, если сеть не только ваша

# ---------------- голоса ----------------
[voice]
profile = "cloud"

[voice.profiles.cloud]
engine = "cloud"
title = "Голос из xiaozhi.me"

# Офлайн-синтез Piper (бинарник и модель положить в /data/alice-station/piper/)
# [voice.profiles.irina]
# engine = "command"
# title = "Ирина (Piper)"
