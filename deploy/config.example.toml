# ---------------- музыка ----------------
[music.stations]
"Радио Рекорд" = "https://radiorecord.hostingradio.ru/rr_main96.aacp"
"Европа Плюс" = "https://ep256.hostingradio.ru:8052/europaplus256.mp3"

[music.vk]
enabled = false   # провайдер ВК пока каркас, см. docs/roadmap.md
