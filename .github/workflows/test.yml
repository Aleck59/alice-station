name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libopus0
      - run: pip install -r agent/requirements.txt
      - run: python -m unittest discover -s agent/tests -v
      - run: sh -n deploy/install.sh && sh -n deploy/uninstall.sh && sh -n deploy/run.sh && sh -n deploy/S99zzalice-station
